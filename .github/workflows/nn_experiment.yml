name: FGZ COOP + ASOS Operational AI-MOS Suite

on:
  workflow_dispatch:
    inputs:
      fast_smoke:
        description: "Optional fast smoke test (leave unchecked for full operational run)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/nn_experiment.yml"

jobs:
  operational-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch and package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Run zero-estimated QC, gating, and alignment unit tests
        run: pytest -v

      - name: Restore cached Parquet archives
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: fgz-op-v4-${{ hashFiles('configs/stations_fgz_coop.json', 'configs/experiment.yaml') }}-${{ github.run_id }}
          restore-keys: |
            fgz-op-v4-${{ hashFiles('configs/stations_fgz_coop.json', 'configs/experiment.yaml') }}-
            fgz-op-v4-

      - name: Snapshot raw file count
        id: pre-count
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data/raw
          echo "count=$(find data/raw -type f | wc -l)" >> $GITHUB_OUTPUT

      - name: Run Full One-Click Operational Experiment & Live 5-Day Forecast
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          SMOKE_ARG=""
          if [ "${{ inputs.fast_smoke }}" = "true" ]; then
            SMOKE_ARG="--fast-smoke"
          fi
          python scripts/run_pipeline.py $SMOKE_ARG

      - name: Check for new cache files
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          AFTER_COUNT=$(find data/raw -type f 2>/dev/null | wc -l || echo 0)
          if [ "$AFTER_COUNT" != "${{ steps.pre-count.outputs.count }}" ]; then
            echo "NEW_CACHE_FILES=true" >> $GITHUB_ENV
          else
            echo "NEW_CACHE_FILES=false" >> $GITHUB_ENV
          fi

      - name: Save Parquet cache
        if: always() && github.event_name == 'workflow_dispatch' && env.NEW_CACHE_FILES == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: fgz-op-v4-${{ hashFiles('configs/stations_fgz_coop.json', 'configs/experiment.yaml') }}-${{ github.run_id }}

      - name: Print Leaderboard to Job Summary
        if: github.event_name == 'workflow_dispatch' && hashFiles('data/runs/leaderboard.csv') != ''
        run: |
          echo "## FGZ COOP + ASOS Operational 5-Day MAE Leaderboard (°F)" >> $GITHUB_STEP_SUMMARY
          echo '```csv' >> $GITHUB_STEP_SUMMARY
          cat data/runs/leaderboard.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Single Master Drop-In JSON
        if: github.event_name == 'workflow_dispatch' && hashFiles('data/runs/master_analysis_bundle.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fgz-operational-master-${{ github.run_number }}
          path: data/runs/master_analysis_bundle.json
          retention-days: 7
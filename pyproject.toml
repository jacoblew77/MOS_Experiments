[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fgz-nn-lab"
version = "0.1.0"
description = "5-day Min T and Max T multi-source neural network testbed for WFO Flagstaff COOP stations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]